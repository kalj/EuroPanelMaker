name: Platforms (temporary)

on: push

jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          choco install -y --no-progress openscad imagemagick
          # The runner has no OpenGL; use Mesa's software renderer.
          gh release download -R pal1000/mesa-dist-win -p 'mesa3d-*-release-msvc.7z' -O mesa.7z
          7z x -y -omesa mesa.7z > /dev/null
          cp mesa/x64/*.dll "/c/Program Files/OpenSCAD/"
          ls "/c/Program Files/OpenSCAD/"
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          curl -fsSL -o openscad.dmg https://files.openscad.org/OpenSCAD-2021.01.dmg
          hdiutil attach -nobrowse -mountpoint /Volumes/OpenSCAD openscad.dmg
          cp -R /Volumes/OpenSCAD/OpenSCAD.app /Applications/
          /Applications/OpenSCAD.app/Contents/MacOS/OpenSCAD --version
          brew install imagemagick
      - name: Show which tools the script finds
        shell: bash
        run: |
          export PATH="$PATH:$(ls -d /c/Program\ Files/ImageMagick* 2>/dev/null | head -1)"
          which magick compare montage openscad || true
      - name: --show --no-open
        shell: bash
        run: |
          export PATH="$PATH:$(ls -d /c/Program\ Files/ImageMagick* 2>/dev/null | head -1)"
          python3 tests/run_tests.py --show --no-open || python tests/run_tests.py --show --no-open
      - name: --check --geometry
        if: always()
        shell: bash
        run: |
          export PATH="$PATH:$(ls -d /c/Program\ Files/ImageMagick* 2>/dev/null | head -1)"
          PY=$(command -v python3 || command -v python)
          "$PY" tests/run_tests.py --check --geometry
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: output-${{ matrix.os }}
          path: tests/output/
